apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flink-kubernetes-operator
  namespace: flink
spec:
  serviceAccountName: helm-controller
  relseleaseName: flink-kubernetes-operator
  chart:
    spec:
      chart: flink-kubernetes-operator
      version: 1.15.0
      sourceRef:
        kind: HelmRepository
        name: flink-operator-repo
        namespace: flink
  interval: 5m
  install:
    crds: Skip
    remediation:
      retries: 3
