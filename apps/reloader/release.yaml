apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
spec:
  serviceAccountName: helm-controller
  releaseName: reloader
  chart:
    spec:
      chart: reloader
      version: 2.2.21
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: reloader
  interval: 1m
  install:
    crds: Skip
  upgrade:
    crds: Skip
  values:
    reloader:
      watchGlobally: false
      namespaces: ["default"]
      logFormat: "json"
