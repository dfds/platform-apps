---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-recommender
  namespace: vpa
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: vpa-vpa-vertical-pod-autoscaler-recommender
  updatePolicy:
    updateMode: "Off"

---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-vpa-vertical-pod-autoscaler-admission-controller
  namespace: vpa
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: vpa-vpa-vertical-pod-autoscaler-admission-controller
  updatePolicy:
    updateMode: "Off"

---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-updater
  namespace: vpa
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: vpa-vpa-vertical-pod-autoscaler-updater
  updatePolicy:
    updateMode: "Off"