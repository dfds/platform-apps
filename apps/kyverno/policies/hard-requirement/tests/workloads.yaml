---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probes-ok
  namespace: default
spec:
  selector:
    matchLabels:
      app: probes-ok
  template:
    metadata:
      labels:
        app: probes-ok
    spec:
      containers:
      - name: app
        image: nginx
        livenessProbe: &id001
          httpGet:
            path: /healthz
            port: 8080
        readinessProbe: *id001
  replicas: 1
