apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-hpa
  annotations:
    policies.kyverno.io/title: Require horizontal pod autoscaler (HPA)
    policies.kyverno.io/category: Requirement
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Deployment,StatefulSet
    policies.kyverno.io/description: >-
      Deployments and StatefulSets must have a corresponding Horizontal Pod Autoscaler (HPA) defined if the replica count is > 2.
spec:
  evaluation:
    background:
      enabled: true

  # Due to cross resource validation limitations (the HPA is often created after the
  # workload), Deny won't work as expected and Warn can give a false positive on first apply.
  validationActions:
    - Audit

  matchConstraints:
    resourceRules:
      - apiGroups: ['apps']
        apiVersions: ['v1']
        operations:
          - CREATE
          - UPDATE
        resources:
          - deployments
          - statefulsets

  matchConditions:
    # Equivalent of the ClusterPolicy exclude on namespaces.
    - name: exclude-system-namespaces
      expression: "!(object.metadata.namespace in ['kube-system', 'kyverno'])"
    # Equivalent of the ClusterPolicy precondition.
    - name: replicas-greater-than-two
      expression: "object.spec.?replicas.orValue(1) > 2"

  variables:
    - name: matchingHpas
      expression: >-
        dyn(resource.List("autoscaling/v2", "horizontalpodautoscalers", object.metadata.namespace).items)
          .filter(hpa,
            hpa.spec.scaleTargetRef.name == object.metadata.name
            && hpa.spec.scaleTargetRef.kind == object.kind
          )

  validations:
    - expression: >-
        size(variables.matchingHpas) > 0
      message: >-
        For Deployments or StatefulSets with replicas > 2, a matching HorizontalPodAutoscaler resource is required.
        Visit https://wiki.dfds.cloud/en/playbooks/kyverno#require-hpa-for-deploymentsstatefulsets-with-replicas-2 for more information.
