---
apiVersion: v1
kind: Pod
metadata:
  name: resources-ok
  namespace: default
spec:
  containers:
  - name: app
    image: nginx
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: resources-missing
  namespace: default
spec:
  containers:
  - name: app
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: cpu-request-missing
  namespace: default
spec:
  containers:
  - name: app
    image: nginx
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: cpu-limit-set
  namespace: default
spec:
  containers:
  - name: app
    image: nginx
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: memory-limit-missing
  namespace: default
spec:
  containers:
  - name: app
    image: nginx
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: memory-request-missing
  namespace: default
spec:
  containers:
  - name: app
    image: nginx
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: memory-mismatch
  namespace: default
spec:
  containers:
  - name: app
    image: nginx
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: sidecar-missing-resources
  namespace: default
spec:
  containers:
  - name: app
    image: nginx
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 128Mi
  - name: sidecar
    image: busybox
---
apiVersion: v1
kind: Pod
metadata:
  name: resources-excluded-kube-system
  namespace: kube-system
spec:
  containers:
  - name: app
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: resources-excluded-kyverno
  namespace: kyverno
spec:
  containers:
  - name: app
    image: nginx
