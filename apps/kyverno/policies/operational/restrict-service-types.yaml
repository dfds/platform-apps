apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-service-types
  annotations:
    policies.kyverno.io/title: Service Type Restriction
    policies.kyverno.io/category: Operational (Best Practices)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Service
    policies.kyverno.io/description: >-
      Services of type LoadBalancer and NodePort are not allowed. This prevents the creation of LoadBalancer and NodePort Services which can lead to unintended exposure and costs.
spec:
  evaluation:
    background:
      enabled: true

  validationActions:
    - Deny
    - Warn

  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations:
          - CREATE
          - UPDATE
        resources:
          - services

  matchConditions:
    - name: exclude-traefik-variant-namespaces
      expression: "!(object.metadata.namespace in ['traefik-blue-variant', 'traefik-green-variant'])"

  validations:
    - expression: >-
        !(object.spec.type in ['LoadBalancer', 'NodePort'])
      message: "Services of type LoadBalancer and NodePort are not allowed."
