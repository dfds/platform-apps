apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privilege-escalation
  annotations:
    policies.kyverno.io/title: Disallow Privilege Escalation
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Privilege escalation, such as via set-user-ID or set-group-ID file mode, should not be allowed.
      This policy ensures the `allowPrivilegeEscalation` field is set to `false`.
spec:
  evaluation:
    background:
      enabled: true

  validationActions:
    - Audit

  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods

  # Equivalent of the ClusterPolicy exclude on namespaces.
  matchConditions:
    - name: exclude-system-namespaces
      expression: "!(object.metadata.namespace in ['kube-system', 'kyverno'])"

  variables:
    # Combine standard, init, and ephemeral containers into a single list.
    - name: allContainers
      expression: >-
        object.spec.containers
        + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([])

  validations:
    - expression: >-
        variables.allContainers.all(container,
          container.?securityContext.?allowPrivilegeEscalation.orValue(true) == false
        )
      message: >-
        Privilege escalation is not allowed. The fields
        spec.containers[*].securityContext.allowPrivilegeEscalation,
        spec.initContainers[*].securityContext.allowPrivilegeEscalation, and
        spec.ephemeralContainers[*].securityContext.allowPrivilegeEscalation must be set to `false`.
        Visit https://wiki.dfds.cloud/en/playbooks/kyverno#disallow-privilege-escalation for more information.
