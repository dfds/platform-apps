apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-capabilities
  annotations:
    policies.kyverno.io/title: Restrict Capabilities
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Linux capabilities provide fine-grained permissions that can be dangerous.
      This policy requires that all capabilities are dropped and only allows adding
      back NET_BIND_SERVICE if needed (per the Restricted Pod Security Standard).
spec:
  evaluation:
    background:
      enabled: true

  validationActions:
    - Audit

  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods

  # Equivalent of the ClusterPolicy exclude on namespaces.
  matchConditions:
    - name: exclude-system-namespaces
      expression: "!(object.metadata.namespace in ['kube-system', 'kyverno'])"

  variables:
    # Combine standard, init, and ephemeral containers into a single list.
    - name: allContainers
      expression: >-
        object.spec.containers
        + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([])

  validations:
    - expression: >-
        variables.allContainers.all(container,
          'ALL' in container.?securityContext.?capabilities.?drop.orValue([])
        )
      message: >-
        All capabilities must be dropped. The fields
        spec.containers[*].securityContext.capabilities.drop,
        spec.initContainers[*].securityContext.capabilities.drop, and
        spec.ephemeralContainers[*].securityContext.capabilities.drop must include `ALL`.
        Visit https://wiki.dfds.cloud/en/playbooks/kyverno#restrict-capabilities for more information.

    - expression: >-
        variables.allContainers.all(container,
          container.?securityContext.?capabilities.?add.orValue([]).all(capability,
            capability == 'NET_BIND_SERVICE'
          )
        )
      message: >-
        Adding capabilities beyond NET_BIND_SERVICE is not allowed. The fields
        spec.containers[*].securityContext.capabilities.add,
        spec.initContainers[*].securityContext.capabilities.add, and
        spec.ephemeralContainers[*].securityContext.capabilities.add must be undefined or
        only include NET_BIND_SERVICE.
        Visit https://wiki.dfds.cloud/en/playbooks/kyverno#restrict-capabilities for more information.
