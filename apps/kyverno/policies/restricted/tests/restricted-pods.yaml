---
apiVersion: v1
kind: Pod
metadata:
  name: compliant
  namespace: default
spec:
  securityContext:
    runAsNonRoot: true
  initContainers:
  - name: init
    image: busybox
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
  containers:
  - name: app
    image: nginx
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
        add:
        - NET_BIND_SERVICE
---
apiVersion: v1
kind: Pod
metadata:
  name: container-level-nonroot
  namespace: default
spec:
  containers:
  - name: app
    image: nginx
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      runAsNonRoot: true
---
