---
apiVersion: v1
kind: Pod
metadata:
  name: compliant
  namespace: default
spec:
  containers:
  - name: app
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: safe-volumes
  namespace: default
spec:
  containers:
  - name: app
    image: nginx
  volumes:
  - name: cache
    emptyDir: {}
  - name: config
    configMap:
      name: app-config
---
apiVersion: v1
kind: Pod
metadata:
  name: host-path
  namespace: default
spec:
  containers:
  - name: app
    image: nginx
  volumes:
  - name: host
    hostPath:
      path: /var/run
---
apiVersion: v1
kind: Pod
metadata:
  name: host-path-mixed
  namespace: default
spec:
  containers:
  - name: app
    image: nginx
  volumes:
  - name: cache
    emptyDir: {}
  - name: host
    hostPath:
      path: /etc
---
apiVersion: v1
kind: Pod
metadata:
  name: privileged-false
  namespace: default
spec:
  initContainers:
  - name: init
    image: busybox
    securityContext:
      privileged: false
  containers:
  - name: app
    image: nginx
    securityContext:
      privileged: false
---
apiVersion: v1
kind: Pod
metadata:
  name: privileged-container
  namespace: default
spec:
  containers:
  - name: app
    image: nginx
    securityContext:
      privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: privileged-init
  namespace: default
spec:
  initContainers:
  - name: init
    image: busybox
    securityContext:
      privileged: true
  containers:
  - name: app
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: privileged-ephemeral
  namespace: default
spec:
  containers:
  - name: app
    image: nginx
  ephemeralContainers:
  - name: debug
    image: busybox
    securityContext:
      privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: excluded-kube-system
  namespace: kube-system
spec:
  containers:
  - name: app
    image: nginx
    securityContext:
      privileged: true
  volumes:
  - name: host
    hostPath:
      path: /
---
apiVersion: v1
kind: Pod
metadata:
  name: excluded-kyverno
  namespace: kyverno
spec:
  containers:
  - name: app
    image: nginx
    securityContext:
      privileged: true
  volumes:
  - name: host
    hostPath:
      path: /
