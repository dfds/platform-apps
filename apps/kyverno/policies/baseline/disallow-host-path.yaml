apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-host-path
  annotations:
    policies.kyverno.io/title: Disallow hostPath Volumes
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod,Volume
    policies.kyverno.io/description: >-
      HostPath volumes let Pods access the host filesystem, which can be used to
      access sensitive host data or escalate privileges. This policy ensures that
      hostPath volumes are not used.
spec:
  evaluation:
    background:
      enabled: true

  validationActions:
    - Audit

  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods

  # Equivalent of the ClusterPolicy exclude on namespaces.
  matchConditions:
    - name: exclude-system-namespaces
      expression: "!(object.metadata.namespace in ['kube-system', 'kyverno'])"

  validations:
    - expression: >-
        object.spec.?volumes.orValue([]).all(volume, !has(volume.hostPath))
      message: >-
        HostPath volumes are not allowed. The field spec.volumes[*].hostPath must not be set.
        Visit https://wiki.dfds.cloud/en/playbooks/kyverno#disallow-hostpath-volumes for more information.
