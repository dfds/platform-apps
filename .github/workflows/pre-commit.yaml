name: Pre-commit

on:
  - pull_request

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
    - uses: alexellis/arkade-get@master
      with:
        kubeconform: latest
        kyverno: v1.17.1
    - uses: pre-commit/action@v3.0.1
